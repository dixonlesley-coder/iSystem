name: CI

# Lightweight gate on every push and pull request: the pure Dart engine tests,
# the Flutter app tests (incl. golden screenshots), and a clean `flutter
# analyze`. Packaging / the Windows build are NOT exercised here (that's the
# Release workflow) — this stays fast and runs on Linux.

on:
  push:
  pull_request:

# Cancel an in-progress run when new commits land on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.3
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Engine tests (pure Dart)
        working-directory: packages/mechx_engine
        run: dart test

      - name: App tests (incl. goldens)
        run: flutter test

      - name: Analyze (must be clean)
        run: flutter analyze
