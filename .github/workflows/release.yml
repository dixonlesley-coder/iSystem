name: Release

# Builds the native-Windows iSystem installer (Inno Setup) and — on a version
# tag (vX.Y.Z) or a manual publish — uploads it plus the auto-update feed
# (latest.json) to a GitHub Release, which the in-app updater (lib/update/)
# reads.
#
# Cut a release one of two ways:
#   1. Push a tag matching the pubspec version:
#        git tag v1.2.0 && git push origin v1.2.0
#   2. Run this workflow manually (workflow_dispatch) with publish=true — it
#      creates and pushes the tag from the pubspec `version` itself. (A push made
#      with GITHUB_TOKEN does not re-trigger workflows, so this cannot recurse.)
# Without publish (a manual run with publish=false) it only builds — the
# installer is attached as a workflow artifact for testing, nothing is published.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release (download + auto-update feed)'
        type: boolean
        default: false

permissions:
  contents: write # the workflow creates the tag/release and uploads assets

# Serialise releases. Two runs publishing the SAME version concurrently race on
# the release assets, which can leave a release with NO installer/latest.json and
# break auto-update. Queue them instead of running in parallel; never cancel a
# publish midway (mirrors PanelMaker's release guard).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUBLISH_INPUT: ${{ inputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.3
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The full gate must pass before we ship — same as CI, belt and braces.
      - name: Engine tests (pure Dart)
        working-directory: packages/mechx_engine
        run: dart test

      # Golden screenshots are platform-locked to their Linux generation host
      # (font anti-aliasing differs ~2% on windows-latest), so they are tagged
      # `golden` and excluded here — the Linux CI gate (ci.yml on ubuntu) runs
      # the full `flutter test` and enforces them. This gate still runs every
      # logic/widget test.
      - name: App tests (logic + widget; goldens enforced on the Linux CI gate)
        run: flutter test --exclude-tags golden

      - name: Analyze (must be clean)
        run: flutter analyze

      # Read the version from pubspec.yaml (source of truth). On a tag push,
      # prefer the tag (strip the leading v) but assert it matches the pubspec.
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC_VERSION="$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*//; s/\+.*$//' | tr -d '[:space:]')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            if [[ "${TAG_VERSION}" != "${PUBSPEC_VERSION}" ]]; then
              echo "::error::Tag v${TAG_VERSION} does not match pubspec version ${PUBSPEC_VERSION}." >&2
              exit 1
            fi
            VERSION="${TAG_VERSION}"
          else
            VERSION="${PUBSPEC_VERSION}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved version: ${VERSION}"

      - name: Build Windows (release)
        run: flutter build windows --release

      # Fetch the ODA File Converter bundle (DWG->DXF) so the installer can embed
      # it at installer\vendor\oda\ (see installer/vendor/oda/README.md). The
      # binary is NOT committed (large + ODA's licence governs redistribution),
      # so CI pulls it from a maintainer-provided source:
      #   1. the ODA_ZIP_URL secret (a direct download URL to a .zip), else
      #   2. a one-time `vendor-oda` GitHub Release asset in THIS repo (a .zip),
      #      downloaded with the built-in token.
      # Absent from both ⇒ the step is a no-op and the installer ships without
      # DWG conversion (DWG import then reports "converter not found"); PDF/DXF
      # are unaffected. continue-on-error keeps a missing bundle from failing the
      # release.
      - name: Fetch bundled ODA File Converter (optional)
        continue-on-error: true
        shell: bash
        env:
          ODA_ZIP_URL: ${{ secrets.ODA_ZIP_URL }}
        run: |
          set -uo pipefail
          mkdir -p installer/vendor/oda
          if [[ -n "${ODA_ZIP_URL:-}" ]]; then
            echo "Fetching ODA bundle from ODA_ZIP_URL secret"
            curl -fSL "$ODA_ZIP_URL" -o oda.zip || true
          fi
          if [[ ! -f oda.zip ]]; then
            echo "Trying the 'vendor-oda' release asset in $GITHUB_REPOSITORY"
            gh release download vendor-oda --repo "$GITHUB_REPOSITORY" \
              --pattern '*.zip' --output oda.zip --clobber || true
          fi
          if [[ ! -f oda.zip ]]; then
            echo "::warning::No ODA bundle found (no ODA_ZIP_URL secret and no vendor-oda release). Installer will ship without DWG conversion."
            exit 0
          fi
          echo "Extracting ODA bundle"
          powershell -NoProfile -Command \
            "Expand-Archive -Path oda.zip -DestinationPath installer/vendor/oda -Force"
          # The .iss bundles installer\vendor\oda\* into {app}\oda, where the app
          # looks for ODAFileConverter.exe at the TOP level — flatten a zip that
          # nests everything under one folder.
          exe="$(find installer/vendor/oda -iname 'ODAFileConverter.exe' | head -1 || true)"
          if [[ -z "$exe" ]]; then
            echo "::warning::ODA bundle had no ODAFileConverter.exe — ignoring."
            rm -rf installer/vendor/oda && mkdir -p installer/vendor/oda
            exit 0
          fi
          dir="$(dirname "$exe")"
          if [[ "$dir" != "installer/vendor/oda" ]]; then
            echo "Flattening nested ODA folder ($dir -> installer/vendor/oda)"
            mv "$dir"/* installer/vendor/oda/
          fi
          echo "ODA bundled:"; ls installer/vendor/oda | head -20

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          # iscc is on PATH after choco install (ProgramData\chocolatey\bin).
          # MSYS_NO_PATHCONV=1: Git-Bash otherwise rewrites the leading-slash
          # `/dAppVersion=...` define into a Windows path, so iscc sees two
          # filenames ("You may not specify more than one script filename").
          MSYS_NO_PATHCONV=1 iscc "/dAppVersion=${VERSION}" installer/iSystem.iss
          ls -la build/installer

      # Compute the installer SHA-256 and write the auto-update feed. The url is
      # the stable `releases/latest/download/...` path the in-app updater polls
      # (kDefaultFeedUrl), so it always resolves to the newest published asset.
      - name: Write latest.json (auto-update feed)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          SETUP="build/installer/iSystem-${VERSION}-setup.exe"
          SHA="$(certutil -hashfile "${SETUP//\//\\}" SHA256 | sed -n '2p' | tr -d '[:space:]' | tr 'A-F' 'a-f')"
          REPO="${GITHUB_REPOSITORY}"
          URL="https://github.com/${REPO}/releases/latest/download/iSystem-${VERSION}-setup.exe"
          cat > build/installer/latest.json <<EOF
          {
            "version": "${VERSION}",
            "url": "${URL}",
            "sha256": "${SHA}",
            "notes": "iSystem ${VERSION}"
          }
          EOF
          echo "latest.json:"
          cat build/installer/latest.json

      # Decide whether to publish: always on a tag push, or a manual publish=true.
      - name: Determine publish mode
        id: mode
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* || "${PUBLISH_INPUT:-}" == "true" ]]; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          fi

      # On a manual publish, create + push the tag (a published release needs its
      # tag to exist; GitHub rejects a tagless non-draft release). Pushes made
      # with GITHUB_TOKEN don't re-trigger workflows, so this can't recurse.
      - name: Create and push tag (manual publish)
        if: steps.mode.outputs.publish == 'true' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists locally"
          else
            git tag "v${VERSION}"
          fi
          git push origin "v${VERSION}" || echo "Tag v${VERSION} already on remote"

      # Pre-create the GitHub Release so the uploads below only UPLOAD to it
      # (never race to create it — PanelMaker hit a race where parallel uploads
      # each tried to create the release and assets were dropped).
      - name: Create GitHub Release (if absent)
        if: steps.mode.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists"
          else
            gh release create "v${VERSION}" --title "${VERSION}" --notes "iSystem ${VERSION}"
          fi

      - name: Upload release assets
        if: steps.mode.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          gh release upload "v${VERSION}" \
            "build/installer/iSystem-${VERSION}-setup.exe" \
            "build/installer/latest.json" \
            --clobber

      # Always keep the installer + feed as workflow artifacts (handy for an
      # unpublished test build).
      - name: Upload installer as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iSystem-windows
          path: |
            build/installer/*.exe
            build/installer/latest.json
          if-no-files-found: ignore
